<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blocks</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd3f0;font-family:system-ui,sans-serif}
  canvas{display:block}
  #hud{position:fixed;top:10px;left:12px;color:#fff;text-shadow:0 1px 3px #000;font-size:14px;line-height:1.5;pointer-events:none}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:#fff;mix-blend-mode:difference;pointer-events:none}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,30,40,.55);color:#fff;font-size:20px;text-align:center;cursor:pointer}
</style>
</head>
<body>
<div id="hud"></div><div id="cross"></div>
<div id="start"><div>Click to play<br><small>WASD move · Space jump · Left click break · Right click place · 1–5 pick block</small></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const COLORS = [0, 0x6aa84f, 0x8d6e63, 0x9e9e9e, 0xe0c068, 0xd9534f];
const NAMES = ['', 'Grass', 'Dirt', 'Stone', 'Sand', 'Brick'];
const SPAWN = { x: 16, y: 2, z: 16 };

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3f0);
scene.fog = new THREE.Fog(0x9fd3f0, 40, 120);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);
camera.rotation.order = 'YXZ';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(0.5, 1, 0.3);
scene.add(sun);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Blocks ----------
const geo = new THREE.BoxGeometry(1, 1, 1);
const mats = COLORS.map(c => c && new THREE.MeshLambertMaterial({ color: c }));
const blocks = new Map();
const key = (x, y, z) => x + ',' + y + ',' + z;
function setBlock(x, y, z, b) {
  const k = key(x, y, z), old = blocks.get(k);
  if (old) { scene.remove(old.mesh); blocks.delete(k); }
  if (b) {
    const mesh = new THREE.Mesh(geo, mats[b]);
    mesh.position.set(x + .5, y + .5, z + .5);
    scene.add(mesh);
    blocks.set(k, { b, mesh });
  }
}

// ---------- Network ----------
let myId = null, ws;
const others = new Map();
function makeAvatar(id) {
  const g = new THREE.Group();
  const col = new THREE.Color().setHSL((id * 0.137) % 1, 0.7, 0.55);
  const body = new THREE.Mesh(new THREE.BoxGeometry(.6, 1.2, .6), new THREE.MeshLambertMaterial({ color: col }));
  body.position.y = .6;
  const head = new THREE.Mesh(new THREE.BoxGeometry(.5, .5, .5), new THREE.MeshLambertMaterial({ color: 0xf1c27d }));
  head.position.y = 1.45;
  const face = new THREE.Mesh(new THREE.BoxGeometry(.3, .1, .05), new THREE.MeshBasicMaterial({ color: 0x222222 }));
  face.position.set(0, 1.5, -.26);
  g.add(body, head, face);
  scene.add(g);
  return { g, x: 0, y: 0, z: 0, ry: 0 };
}
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'init') {
      myId = m.id;
      m.blocks.forEach(([x, y, z, b]) => setBlock(x, y, z, b));
    } else if (m.t === 'set') setBlock(m.x, m.y, m.z, m.b);
    else if (m.t === 'leave') {
      const o = others.get(m.id);
      if (o) { scene.remove(o.g); others.delete(m.id); }
    } else if (m.t === 'pos') {
      for (const id in m.players) {
        if (+id === myId) continue;
        let o = others.get(+id);
        if (!o) { o = makeAvatar(+id); o.x = m.players[id].x; o.y = m.players[id].y; o.z = m.players[id].z; others.set(+id, o); }
        Object.assign(o, { tx: m.players[id].x, ty: m.players[id].y, tz: m.players[id].z, try_: m.players[id].ry });
      }
    }
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

// ---------- Player ----------
const p = { ...SPAWN }, vel = { y: 0 };
let yaw = 0, pitch = 0, onGround = false, selected = 1;
const keys = {};
const HW = 0.3, HEIGHT = 1.8;

function hit() {
  for (let x = Math.floor(p.x - HW); x <= Math.floor(p.x + HW); x++)
    for (let y = Math.floor(p.y); y <= Math.floor(p.y + HEIGHT); y++)
      for (let z = Math.floor(p.z - HW); z <= Math.floor(p.z + HW); z++)
        if (blocks.has(key(x, y, z))) return true;
  return false;
}
function move(dx, dy, dz) {
  p.x += dx; if (hit()) p.x -= dx;
  p.z += dz; if (hit()) p.z -= dz;
  p.y += dy; onGround = false;
  if (hit()) { p.y -= dy; if (dy < 0) onGround = true; vel.y = 0; }
}
function intersectsPlayer(bx, by, bz) {
  return bx + 1 > p.x - HW && bx < p.x + HW && by + 1 > p.y && by < p.y + HEIGHT && bz + 1 > p.z - HW && bz < p.z + HW;
}

// Step along the view ray; return the hit block and the empty cell in front of it.
function target() {
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  let prev = null;
  for (let t = 0; t < 6; t += 0.04) {
    const x = Math.floor(camera.position.x + dir.x * t);
    const y = Math.floor(camera.position.y + dir.y * t);
    const z = Math.floor(camera.position.z + dir.z * t);
    if (blocks.has(key(x, y, z))) return { hit: [x, y, z], prev };
    prev = [x, y, z];
  }
  return null;
}

// ---------- Input ----------
const startEl = document.getElementById('start'), hud = document.getElementById('hud');
startEl.onclick = () => renderer.domElement.requestPointerLock();
document.addEventListener('pointerlockchange', () => {
  startEl.style.display = document.pointerLockElement ? 'none' : 'flex';
});
document.addEventListener('mousemove', (e) => {
  if (!document.pointerLockElement) return;
  yaw -= e.movementX * 0.0025;
  pitch = Math.max(-1.55, Math.min(1.55, pitch - e.movementY * 0.0025));
});
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  const n = +e.key; if (n >= 1 && n <= 5) selected = n;
});
addEventListener('keyup', (e) => keys[e.code] = false);
addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('mousedown', (e) => {
  if (!document.pointerLockElement) return;
  const t = target(); if (!t) return;
  if (e.button === 0) send({ t: 'set', x: t.hit[0], y: t.hit[1], z: t.hit[2], b: 0 });
  else if (e.button === 2 && t.prev && !intersectsPlayer(...t.prev))
    send({ t: 'set', x: t.prev[0], y: t.prev[1], z: t.prev[2], b: selected });
});

// ---------- Loop ----------
let last = performance.now(), sendTimer = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;

  let fx = 0, fz = 0;
  if (keys.KeyW) fz -= 1; if (keys.KeyS) fz += 1;
  if (keys.KeyA) fx -= 1; if (keys.KeyD) fx += 1;
  const len = Math.hypot(fx, fz) || 1, speed = 5;
  const mx = (fx * Math.cos(yaw) + fz * Math.sin(yaw)) / len * speed * dt;
  const mz = (-fx * Math.sin(yaw) + fz * Math.cos(yaw)) / len * speed * dt;

  if (keys.Space && onGround) { vel.y = 8.5; onGround = false; }
  vel.y -= 25 * dt;
  move(mx, vel.y * dt, mz);
  if (p.y < -20) { Object.assign(p, SPAWN); vel.y = 0; }

  camera.position.set(p.x, p.y + 1.6, p.z);
  camera.rotation.set(pitch, yaw, 0);

  for (const o of others.values()) {
    if (o.tx === undefined) continue;
    o.x += (o.tx - o.x) * 0.3; o.y += (o.ty - o.y) * 0.3; o.z += (o.tz - o.z) * 0.3;
    o.ry += (o.try_ - o.ry) * 0.3;
    o.g.position.set(o.x, o.y, o.z); o.g.rotation.y = o.ry;
  }

  sendTimer += dt;
  if (sendTimer > 0.05) { sendTimer = 0; send({ t: 'pos', x: p.x, y: p.y, z: p.z, ry: yaw }); }

  hud.innerHTML = `Block: <b>${selected} ${NAMES[selected]}</b> · Players online: ${others.size + 1}`;
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
